services:
  db:
    image: postgres:17-alpine
    ports: ["127.0.0.1:5438:5432"]
    environment:
      POSTGRES_USER: proofpay
      POSTGRES_PASSWORD: proofpay_local_only
      POSTGRES_DB: proofpay
    volumes: ["proofpay_db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proofpay"]
      interval: 3s
      retries: 20
volumes:
  proofpay_db:
