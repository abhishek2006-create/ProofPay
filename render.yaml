services:
  - type: web
    name: proofpay
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm ci && npm run build
    preDeployCommand: npm run db:migrate
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 24.12.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: proofpay-db
          property: connectionString
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_URL
        sync: false
      - key: APP_URL
        sync: false
      - key: PAYPAL_ENV
        value: sandbox
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_MERCHANT_ID
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: AI_PRETRAINED_MODEL
        value: gpt-4.1-mini
      - key: AI_BASE_URL
        value: https://api.openai.com/v1
      - key: AI_RESPONSE_FORMAT
        value: json_schema
      - key: EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: EMBEDDING_BASE_URL
        value: https://api.openai.com/v1
      # Embeddings reuse AI_API_KEY unless EMBEDDING_API_KEY is set separately.
      - key: RUNNER_SECURITY_APPROVED
        value: 'false'
      - key: ENABLE_DEMO
        value: 'false'
databases:
  - name: proofpay-db
    plan: 0.1c-256mb
    postgresMajorVersion: '17'
    ipAllowList: []
    databaseName: proofpay
    user: proofpay
